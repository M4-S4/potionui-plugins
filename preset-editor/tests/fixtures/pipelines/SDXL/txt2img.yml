pipeline:
  - name: "checkpoint_loader/sdxl"
    id: "checkpoint_loader"
    enabled: true
    configuration:
      model:
        file_path: "{{ form.model }}"
        name: "{{ form.model }}"
        base: "SDXL"
      loras:
        "@loop":
          items: "{{ form.loras }}"
          template:
            file_path: "{{ item.model }}"
            weight: "{{ item.strength }}"
      nsfw: "{{ runtime.settings.nsfw }}"
      clip_skip: "{{ form.clip_skip }}"
  - name: "prompt_encoder"
    id: "prompt_encoder"
    input:
      - ["text_encoder", "checkpoint_loader/sdxl", "text_encoder"]
    enabled: true
    configuration:
      p_prompt:
        input: "{{ generation.prompts.first.positive }}"
        output: |
          {{ generation.prompts.first.positive }}

          {% for i in range(1, 4) %}{% if form['positive_embedding_' ~ i] and form['positive_embedding_' ~ i] != '' %} positive_embedding_{{ i }}{% endif %}{% endfor %}
      n_prompt:
        input: "{{ generation.prompts.first.negative }}"
        output: |
          {{ generation.prompts.first.negative }}

          {% for i in range(1, 4) %}{% if form['negative_embedding_' ~ i] and form['negative_embedding_' ~ i] != '' %} negative_embedding_{{ i }}{% endif %}{% endfor %}
      positive_embeddings:
        "@loop":
          count: 3
          template:
            token: "positive_embedding_{{ loop.index }}"
            file_path: "{{ form['positive_embedding_' ~ loop.index] }}"
            enabled: "{{ form['positive_embedding_' ~ loop.index] and form['positive_embedding_' ~ loop.index] != '' }}"
      negative_embeddings:
        "@loop":
          count: 3
          template:
            token: "negative_embedding_{{ loop.index }}"
            file_path: "{{ form['negative_embedding_' ~ loop.index] }}"
            enabled: "{{ form['negative_embedding_' ~ loop.index] and form['negative_embedding_' ~ loop.index] != '' }}"
      pairs: "{{ generation.prompts.pairs }}"
      quantity: "{{ form.quantity }}"

  - name: "controlnet_loader/sdxl"
    id: "controlnet_loader"
    enabled: "{{ form.enable_controlnet }}"
    configuration:
      controlnets:
        "@loop":
          count: "{{ preset.vars.num_controlnet_slots }}"
          template:
            file_path: "{{ form['controlnet_' ~ loop.index ~ '_model'] | default('') }}"
            name: "{{ form['controlnet_' ~ loop.index ~ '_model'] | default('') }}"
            type: "{{ form['controlnet_' ~ loop.index ~ '_type'] | default('') }}"
            conditioning_scale: "{{ form['controlnet_' ~ loop.index ~ '_scale'] | default(1.0) }}"
            control_guidance_start: "{{ form['controlnet_' ~ loop.index ~ '_start'] | default(0.0) }}"
            control_guidance_end: "{{ form['controlnet_' ~ loop.index ~ '_end'] | default(1.0) }}"
            enabled: "{{ (form['controlnet_' ~ loop.index ~ '_model'] | default('')) != '' }}"

  - name: "media_loader"
    enabled: "{{ form.enable_controlnet }}"
    configuration:
      media:
        "@loop":
          count: "{{ preset.vars.num_controlnet_slots }}"
          template:
            type: "image"
            path: "{{ form['controlnet_' ~ loop.index ~ '_image'] | default('') }}"
          when: "{{ (form['controlnet_' ~ loop.index ~ '_image'] | default('')) != '' }}"

  - name: "controlnet_preprocessor"
    id: "controlnet_preprocessor"
    enabled: "{{ form.enable_controlnet and form.controlnet_auto_preprocess }}"
    input:
      - ["image", "media_loader", "image"]
    configuration:
      preprocessors:
        "@loop":
          count: "{{ preset.vars.num_controlnet_slots }}"
          template:
            type: "{{ form['controlnet_' ~ loop.index ~ '_type'] | default('') }}"
            enabled: "{{ (form['controlnet_' ~ loop.index ~ '_image'] | default('')) != '' }}"
            parameters: {}

  - name: "seed_generator"
    id: "seed_generator"
    enabled: true
    configuration:
      seed: "{{ form.seed }}"
      quantity: "{{ form.quantity }}"

  - name: "dynamic_prompts_renderer"
    id: "dynamic_prompts_renderer"
    enabled: true
    configuration:
      pairs: "{{ generation.prompts.pairs }}"
      quantity: "{{ form.quantity }}"

  - name: "from_iotype"
    id: "from_iotype"
    enabled: true
    input:
      - [ "seed", "seed_generator", "seed" ]
    configuration:
      from: "seed"

  - name: "param_emitter"
    id: "param_emitter"
    enabled: true
    input:
      - [ "seed", "from_iotype", "seed" ]
    configuration:
      quantity: "{{ form.quantity }}"
      parameters:
        - ["model", "{{ form.model }}"]
        - "@loop":
            items: "{{ form.loras | active_loras }}"
            template: ["model", "{{ item.model }}"]
        - ["positive_prompt", "{{ generation.prompts.positives }}"]
        - ["negative_prompt", "{{ generation.prompts.negatives }}"]
        - ["cfg", "{{ form.cfg | default(preset.vars.default_cfg) }}"]
        - ["steps", "{{ form.steps | default(preset.vars.default_steps) }}"]
        - ["sampler", "{{ form.sampler | default(preset.vars.default_sampler) }}"]
        - ["scheduler", "{{ form.scheduler | default(preset.vars.default_scheduler) }}"]
        - ["resolution", "{{ form.resolution }}"]
        - ["clip_skip", "{{ form.clip_skip }}"]

  - name: "adm_guidance/sdxl"
    id: "adm_guidance"
    enabled: "{{ form.adm_guidance_enabled }}"
    input:
      - ["model", "checkpoint_loader/sdxl", "model"]
    configuration:
      positive_scale: "{{ form.adm_positive_scale }}"
      negative_scale: "{{ form.adm_negative_scale }}"
      scaler_end: "{{ form.adm_scaler_end }}"

  - name: "sharpness/sdxl"
    id: "sharpness"
    enabled: "{{ form.sharpness|float > 0 }}"
    input:
      - ["model", "checkpoint_loader/sdxl", "model"]
    configuration:
      strength: "{{ form.sharpness }}"

  - name: "sag/sdxl"
    id: "sag"
    enabled: "{{ form.sag_enabled }}"
    input:
      - ["model", "checkpoint_loader/sdxl", "model"]
    configuration:
      scale: "{{ form.sag_scale }}"
      sigma: "{{ form.sag_sigma }}"
      sag_threshold: "{{ form.sag_threshold }}"

  - name: "generator/sdxl"
    id: "generator"
    enabled: true
    input:
      - [ "model", "checkpoint_loader/sdxl", "model" ]
      - [ "conditioning", "prompt_encoder", "conditioning" ]
      - [ "seed", "seed_generator", "seed" ]
      - [ "controlnet", "controlnet_loader/sdxl", "controlnet" ]
      - [ "control_image", "{% if form.controlnet_auto_preprocess == true %}controlnet_preprocessor{% else %}media_loader{% endif %}", "image" ]
    configuration:
      cfg: "{{ form.cfg | default(preset.vars.default_cfg) }}"
      steps: "{{ form.steps | default(preset.vars.default_steps) }}"
      sampler: "{{ form.sampler | default(preset.vars.default_sampler) }}"
      scheduler: "{{ form.scheduler | default(preset.vars.default_scheduler) }}"
      quantity: "{{ form.quantity }}"
      resolution: "{{ preset.vars.resolution_snap.get((form.resolution).split('x')[0] | int, form.resolution) }}"

  - name: "upscaler"
    id: "upscaler"
    enabled: "{{ form.upscale_factor > 1 }}"
    input:
      - [ "image", "generator/sdxl", "image" ]
    configuration:
      model: "{{ form.upscale_model }}"
      scale: "{{ form.upscale_factor }}"

  - name: "tiled_detailer/sdxl"
    id: "tiled_detailer"
    enabled: "{{ form.upscale_factor > 1 and form.td_enable == true }}"
    input:
      - [ "model", "checkpoint_loader/sdxl", "model" ]
      - [ "image", "{% if form.upscale_factor > 1 %}upscaler{% else %}generator/sdxl{% endif %}", "image" ]
      - [ "conditioning", "prompt_encoder", "conditioning" ]
      - [ "seed", "seed_generator", "seed" ]
    configuration:
      denoise: "{{ form.td_denoise | default(preset.vars.tiled_detailer_denoise) }}"
      steps: "{{ form.td_steps | default(preset.vars.tiled_detailer_steps) }}"
      cfg: "{{ form.td_cfg | default(preset.vars.tiled_detailer_cfg) }}"
      detail_boost: "{{ form.td_detail_boost | default(preset.vars.tiled_detailer_boost) }}"
      sampler: "{{ form.sampler | default(preset.vars.default_sampler) }}"
      scheduler: "{{ form.scheduler | default(preset.vars.default_scheduler) }}"

      tile_size: "{{ form.td_tile_size }}"
      overlap: "{{ form.td_overlap | default(((form.resolution).split('x')[0]|int >= 1792 and 128 or 64)) }}"
      feather_amount: "{{ form.td_feather_amount }}"

      min_tile_size: "{{ form.td_min_tile_size }}"

      adaptive_tiles: "{{ 'adaptive_tiles' in (form.td_adaptive_tiles) }}"
      enable_detail_conditioning: "{{ 'enable_detail_conditioning' in (form.td_adaptive_tiles) }}"
      content_aware_denoise: "{{ 'content_aware_denoise' in (form.td_adaptive_tiles) }}"

      min_denoise: "{{ form.td_min_denoise }}"
      max_denoise: "{{ form.td_max_denoise }}"

  - name: "detailer/sdxl"
    id: "detailer"
    enabled: true
    input:
      - [ "model", "checkpoint_loader/sdxl", "model" ]
      - [ "image", "{% if form.upscale_factor == 1 %}generator/sdxl{% elif form.upscale_factor > 1 and form.td_enable == true %}tiled_detailer/sdxl{% else %}upscaler{% endif %}", "image" ]
      - [ "conditioning", "prompt_encoder", "conditioning" ]
      - [ "seed", "seed_generator", "seed" ]
    configuration:
      detect: [ "face", "hand", "eyes", "teeth", "person" ]
      detections:
        face:
          type: "{{ form.face_detector_type | default('yolo') }}"  # yolo or mediapipe
          model: "{{ form.face_detector_model | default('models/detection_bbox/face_yolov12m.pt', true) }}"
          enabled: "{{ form.face_detailer_enabled }}"
          strength: "{{ form.face_strength | default(preset.vars.face_fix_strength) }}"
          confidence: "{{ form.face_confidence | default(preset.vars.face_fix_confidence) }}"
          steps: "{{ form.face_steps | default(preset.vars.face_fix_steps) }}"
          cfg: "{{ form.face_cfg | default(preset.vars.face_fix_cfg) }}"
          sampler: "{{ form.sampler | default(preset.vars.default_sampler) }}"
          scheduler: "{{ form.scheduler | default(preset.vars.default_scheduler) }}"
          min_size_for_upscale: "{{ form.face_min_size }}"
          upscale_factor: "{{ form.face_upscale_factor }}"
          mask_blur: "{{ form.face_mask_blur }}"
          padding: "{{ form.face_padding }}"
        hand:
          type: "{{ form.hand_detector_type | default('yolo') }}"  # yolo or mediapipe
          model: "{{ form.hand_detector_model | default('models/detection_bbox/hand_yolov8n.pt', true) }}"
          enabled: "{{ form.hand_detailer_enabled }}"
          strength: "{{ form.hand_strength }}"
          confidence: "{{ form.hand_confidence }}"
          steps: "{{ form.hand_steps }}"
          cfg: "{{ form.hand_cfg }}"
          sampler: "{{ form.sampler | default(preset.vars.default_sampler) }}"
          scheduler: "{{ form.scheduler | default(preset.vars.default_scheduler) }}"
          mask_blur: "{{ form.hand_mask_blur }}"
          padding: "{{ form.hand_padding }}"
        eyes:
          type: "mediapipe"  # Eyes always use MediaPipe (no YOLO model available)
          model: "{{ form.eyes_detector_model | default('models/mediapipe/face_landmarker.task', true) }}"
          enabled: "{{ form.eyes_detailer_enabled }}"
          confidence: "{{ form.eyes_confidence }}"
          strength: "{{ form.eyes_strength }}"
          cfg: "{{ form.eyes_cfg }}"
          steps: "{{ form.eyes_steps }}"
          eye_padding: "{{ form.eyes_padding }}"
          eye_v_padding: "{{ form.eyes_v_padding }}"
          mask_blur: "{{ form.eyes_mask_blur }}"
          sampler: "{{ form.sampler | default(preset.vars.default_sampler) }}"
          scheduler: "{{ form.scheduler | default(preset.vars.default_scheduler) }}"
        teeth:
          type: "mediapipe"  # Teeth always use MediaPipe (no YOLO model available)
          model: "{{ form.teeth_detector_model | default('models/mediapipe/face_landmarker.task', true) }}"
          enabled: "{{ form.teeth_detailer_enabled }}"
          confidence: "{{ form.teeth_confidence }}"
          strength: "{{ form.teeth_strength }}"
          cfg: "{{ form.teeth_cfg }}"
          steps: "{{ form.teeth_steps }}"
          mouth_open_threshold: "{{ form.teeth_mouth_threshold }}"
          teeth_padding: "{{ form.teeth_padding }}"
          teeth_v_padding: "{{ form.teeth_v_padding }}"
          mask_blur: "{{ form.teeth_mask_blur }}"
          sampler: "{{ form.sampler | default(preset.vars.default_sampler) }}"
          scheduler: "{{ form.scheduler | default(preset.vars.default_scheduler) }}"
        person:
          type: "{{ form.person_detector_type | default('yolo') }}"  # Person uses YOLO detection with COCO model
          model: "{{ form.person_detector_model | default('yolov8m.pt', true) }}"
          enabled: "{{ form.person_detailer_enabled }}"
          strength: "{{ form.person_strength }}"
          confidence: "{{ form.person_confidence }}"
          steps: "{{ form.person_steps }}"
          cfg: "{{ form.person_cfg }}"
          sampler: "{{ form.sampler | default(preset.vars.default_sampler) }}"
          scheduler: "{{ form.scheduler | default(preset.vars.default_scheduler) }}"
          mask_blur: "{{ form.person_mask_blur }}"
          padding: "{{ form.person_padding }}"
  - name: "film_grain"
    id: "film_grain"
    enabled: "{{ (form.film_grain) != '' }}"
    input:
      - [ "image", "detailer/sdxl", "image" ]
    configuration:
      preset: "{{ form.film_grain }}"

  - name: "gallery"
    id: "gallery"
    enabled: true
    input:
      - ["image", "{% if form.film_grain %}film_grain{% else %}detailer/sdxl{% endif %}", "image"]
      - ["seed", "seed_generator", "seed"]

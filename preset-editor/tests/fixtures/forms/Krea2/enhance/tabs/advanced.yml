fields:
  - name: "cfg"
    type: "slider"
    formula: "speed"
    label: "CFG Scale"
    audience: "advanced"
    default: 1.0
    ai_hint: "Classifier-free guidance scale for the refine pass. 1.0 = off (today's behavior, single forward). Above 1.0 enables a real negative-prompt pass each step -- set to match whatever CFG the base generation used."
    configuration:
      min: 1.0
      max: 15.0
      step: 0.5

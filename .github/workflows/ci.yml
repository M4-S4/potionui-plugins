name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Public hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: No private path, internal note or relay address in the tracked files
        run: python -B scripts/check-public-hygiene.py

      - name: Self-tests of the check
        run: python -B -m unittest discover -s scripts -p "test_check_public_hygiene.py" -v

  audit:
    name: Potion audit on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: audit
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"

      - name: uv sync (locked, uv-managed Python 3.13)
        run: uv sync --locked

      - name: pytest (fake API, generated outputs)
        run: uv run --locked pytest -q

      - name: H.264 or its mpeg4 fallback in the FFmpeg bundled with PyAV
        run: |
          uv run --locked potion-audit media encoders | tee encoders.txt
          if grep -qx libx264 encoders.txt; then
            echo "preview encoder: libx264"
          elif grep -qx mpeg4 encoders.txt; then
            echo "::warning::no libx264 in the PyAV wheel of ${{ matrix.os }}, previews fall back to mpeg4"
          else
            echo "::error::neither libx264 nor mpeg4 in the PyAV wheel of ${{ matrix.os }}"
            exit 1
          fi

  plugin:
    name: ${{ matrix.name }} on the pinned core
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: video-producer
            name: Video Producer
            core-tests: test_video_producer_*.py
            node-tests: "'frontend/src/i18n/*.test.js' 'frontend/src/lib/*.test.js'"
          - id: preset-editor
            name: Preset Editor
            core-tests: test_preset_editor_*.py
            node-tests: "'frontend/src/lib/*.test.js'"
    env:
      PLUGIN_ID: ${{ matrix.id }}
      CORE_TESTS: ${{ matrix.core-tests }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: plugins

      - name: Read the pinned core
        id: core
        run: echo "ref=$(tr -d '[:space:]' < plugins/core.ref)" >> "$GITHUB_OUTPUT"

      - name: Check out the core
        uses: actions/checkout@v4
        with:
          repository: PotionUI/PotionUI
          ref: ${{ steps.core.outputs.ref }}
          path: core

      - id: py
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the catalogue
        working-directory: plugins
        run: python scripts/catalogue.py --check

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            core/content/plugins/package-lock.json
            core/frontend/package-lock.json

      - name: Resolve cache week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore apt archives
        id: apt
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-libglib-ffmpeg-${{ steps.week.outputs.week }}

      - name: Install system dependencies
        timeout-minutes: 16
        run: |
          sudo grep -rl "dl.google.com" /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          mkdir -p ~/apt-archives/partial
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Dir::Cache::Archives=$HOME/apt-archives"
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
              sudo dpkg --configure -a || true
            fi
            sudo timeout -k 10 90 apt-get update $APT_OPTS || true
            sudo timeout -k 10 180 apt-get install -y --no-install-recommends $APT_OPTS libglib2.0-0 ffmpeg && break
            [ "$attempt" = 3 ] && exit 1
            sleep 10
          done
          sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives

      - name: Save apt archives
        if: steps.apt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-libglib-ffmpeg-${{ steps.week.outputs.week }}

      - name: Restore Python environment
        id: venv
        uses: actions/cache@v4
        with:
          path: ~/venv-ci
          key: py-venv-${{ runner.os }}-${{ steps.py.outputs.python-version }}-${{ hashFiles('core/requirements-ci.txt', 'core/requirements-dev.txt') }}-${{ steps.week.outputs.week }}

      - name: Install backend dependencies (CPU-only torch)
        if: steps.venv.outputs.cache-hit != 'true'
        working-directory: core
        run: |
          python -m venv ~/venv-ci
          ~/venv-ci/bin/python -m pip install --upgrade pip
          ~/venv-ci/bin/python -m pip install -r requirements-ci.txt --extra-index-url https://download.pytorch.org/whl/cpu
          ~/venv-ci/bin/python -m pip install -r requirements-dev.txt
          ~/venv-ci/bin/python -m pip install pytest-timeout

      - name: Use the Python environment
        run: echo "$HOME/venv-ci/bin" >> "$GITHUB_PATH"

      - name: npm ci (plugin toolchain)
        working-directory: core/content/plugins
        run: npm ci

      - name: npm ci (app frontend, which compiles the page stylesheet of a plugin)
        working-directory: core/frontend
        run: npm ci

      - name: Copy the plugin into content/plugins/local of the core
        run: pwsh plugins/scripts/sync-plugins.ps1 -PotionUISrc core -Plugin "$PLUGIN_ID"

      - name: Put this repository's plugin and core-side tests in place of the core's own copies
        run: |
          if [ -d "core/content/plugins/marketplace/$PLUGIN_ID" ]; then
            rsync -a --delete --exclude /frontend/dist/ --exclude /docs/screenshots/ "plugins/$PLUGIN_ID/" "core/content/plugins/marketplace/$PLUGIN_ID/"
          fi
          if [ -d "plugins/core-tests/$PLUGIN_ID" ]; then
            rsync -a --delete --include "$CORE_TESTS" --exclude '*' "plugins/core-tests/$PLUGIN_ID/" core/tests/plugins/marketplace/
          fi

      - name: Build the plugin
        id: build
        working-directory: core
        run: node scripts/build-plugins.mjs "$PLUGIN_ID"

      - name: Upload the built dist
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}-dist
          path: core/content/plugins/local/${{ matrix.id }}/frontend/dist/
          if-no-files-found: error
          retention-days: 14

      - name: pytest (the plugin's own suite)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: core
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          POTIONUI_TEST_THREADS: "1"
        run: >
          python -m pytest "content/plugins/local/$PLUGIN_ID/tests" -q --durations=25 --timeout=300 -n 4 --dist worksteal
          -m "not requires_gpu and not requires_models and not gc_sensitive"
          --junitxml="junit-$PLUGIN_ID.xml"

      - name: pytest (core-side tests)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.core-tests != '' }}
        working-directory: core
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          POTIONUI_TEST_THREADS: "1"
          POTIONUI_TEST_BUDGET_S: "15"
        run: >
          python -m pytest tests/plugins/marketplace/$CORE_TESTS -q --durations=25 --timeout=300
          -m "not requires_gpu and not requires_models and not gc_sensitive"
          --junitxml="junit-$PLUGIN_ID-core.xml"

      - name: node --test (frontend modules)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.node-tests != '' }}
        working-directory: core/content/plugins/local/${{ matrix.id }}
        run: node --test ${{ matrix.node-tests }}

      - name: pytest (the core's tests over its shipped presets and plugins, with the plugin also in content/plugins/marketplace)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: core
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          POTIONUI_TEST_THREADS: "1"
        run: |
          rsync -a --delete --exclude /tests/ "content/plugins/local/$PLUGIN_ID/" "content/plugins/marketplace/$PLUGIN_ID/"
          python -m pytest -q --durations=10 --timeout=300 \
            tests/features/presets/test_mode_labels.py \
            tests/features/recipes/test_shipped_recipes_lint.py \
            tests/features/recipes/executors/test_fixture_form_reactions.py \
            tests/features/plugins/test_default_enabled.py \
            tests/platform/plugins/test_manifest_categories.py \
            -m "not requires_gpu and not requires_models and not gc_sensitive" \
            --junitxml="junit-$PLUGIN_ID-shipped.xml"

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}-pytest
          path: |
            core/junit-${{ matrix.id }}.xml
            core/junit-${{ matrix.id }}-core.xml
            core/junit-${{ matrix.id }}-shipped.xml
          if-no-files-found: ignore
          retention-days: 14

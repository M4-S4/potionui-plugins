name: Release

on:
  push:
    tags:
      - "*-v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: plugins

      - name: Read the tag against the manifest
        id: tag
        run: python3 plugins/scripts/catalogue.py --tag "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Read the pinned core
        id: core
        run: echo "ref=$(tr -d '[:space:]' < plugins/core.ref)" >> "$GITHUB_OUTPUT"

      - name: Check out the core
        uses: actions/checkout@v4
        with:
          repository: PotionUI/PotionUI
          ref: ${{ steps.core.outputs.ref }}
          path: core

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            core/content/plugins/package-lock.json
            core/frontend/package-lock.json

      - name: npm ci (plugin toolchain)
        working-directory: core/content/plugins
        run: npm ci

      - name: npm ci (app frontend, which compiles the page stylesheet of a plugin)
        working-directory: core/frontend
        run: npm ci

      - name: Copy the plugin into content/plugins/local of the core
        env:
          PLUGIN_ID: ${{ steps.tag.outputs.id }}
        run: pwsh plugins/scripts/sync-plugins.ps1 -PotionUISrc core -Plugin "$PLUGIN_ID"

      - name: Build the dist
        working-directory: core
        env:
          PLUGIN_ID: ${{ steps.tag.outputs.id }}
        run: node scripts/build-plugins.mjs "$PLUGIN_ID"

      - name: Package the plugin with its dist, without its tests
        env:
          PLUGIN_ID: ${{ steps.tag.outputs.id }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          archive="$PLUGIN_ID-$VERSION.zip"
          staging="$RUNNER_TEMP/package"
          mkdir -p "$staging"
          rsync -a --exclude /tests/ --exclude __pycache__/ --exclude '*.pyc' --exclude node_modules/ "core/content/plugins/local/$PLUGIN_ID/" "$staging/$PLUGIN_ID/"
          (cd "$staging" && zip -r -X -q "$GITHUB_WORKSPACE/$archive" "$PLUGIN_ID")
          sha256sum "$archive" > "$PLUGIN_ID-$VERSION.sha256"
          cat "$PLUGIN_ID-$VERSION.sha256"

      - name: Check the archive the way the catalogue will record it
        env:
          PLUGIN_ID: ${{ steps.tag.outputs.id }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$PLUGIN_ID-$VERSION.zip"
          cp "$PLUGIN_ID-$VERSION.zip" "$RUNNER_TEMP/"
          python3 plugins/scripts/catalogue.py --release "$PLUGIN_ID" "$RUNNER_TEMP/$PLUGIN_ID-$VERSION.zip" "$url"
          git -C plugins diff -- plugins.json

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_ID: ${{ steps.tag.outputs.id }}
          VERSION: ${{ steps.tag.outputs.version }}
          NAME: ${{ steps.tag.outputs.name }}
        run: |
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$PLUGIN_ID-$VERSION.zip"
          notes="$NAME $VERSION, built against the core $(tr -d '[:space:]' < plugins/core.ref). Unzip $PLUGIN_ID-$VERSION.zip into content/plugins/local/ of a PotionUI instance, then Admin > Plugins > Scan for Plugins. To list this release in the catalogue, download the zip and run: python scripts/catalogue.py --release $PLUGIN_ID $PLUGIN_ID-$VERSION.zip $url, then commit plugins.json."
          gh release create "$GITHUB_REF_NAME" "$PLUGIN_ID-$VERSION.zip" "$PLUGIN_ID-$VERSION.sha256" --repo "$GITHUB_REPOSITORY" --title "$NAME $VERSION" --notes "$notes"
          {
            echo "### $NAME $VERSION"
            echo
            echo "Record it in the catalogue:"
            echo
            echo '```'
            echo "python scripts/catalogue.py --release $PLUGIN_ID $PLUGIN_ID-$VERSION.zip $url"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

id: "media-convert"
name: "Media Converter"
version: "0.2.0"
description: "Convert images, videos and sounds of the Library to another format, extract the sound of a video, make an animation from a video and lighten a video for sending"
author: "M4-S4"
license: "GPL-3.0"
type: "backend-only"
category: "tools"

docs:
  - path: "README.md"
    title: "Media Converter"
    audience: "admin"
  - path: "docs/reference.md"
    title: "Media Converter: reference"
    audience: "admin"

settings:
  - name: "ffmpeg_threads"
    type: "number"
    label: "ffmpeg threads per conversion"
    description: "How many processor threads one video or sound conversion may use."
    default: 4
    min: 1
    max: 16
  - name: "max_minutes"
    type: "number"
    label: "Longest video or sound, in minutes"
    description: "Longer files are refused with a message, from 1 to 30 minutes."
    default: 30
    min: 1
    max: 30
  - name: "allow_h265"
    type: "boolean"
    label: "Allow MP4 (H.265) in Convert video"
    description: "Off by default. H.265 makes lighter files than H.264 but takes several times longer to encode, and some browsers and devices cannot play it. While it is off, the format stays in the list and is refused with a message."
    default: false
  - name: "load_notice"
    type: "info"
    label: "Conversions run on the server's processor"
    description: "They never use the graphics card, but a long video conversion slows down the preparation of a generation that starts meanwhile."

media_tools:
  - id: "media-convert.image"
    label: "Convert image"
    description: "Save the image as PNG, JPEG or WebP, optionally smaller"
    icon: "image"
    accepts: [image]
    produces: image
    cardinality: one_to_one
    scopes: [library, history]
    python: "tools/image.py:ConvertImage"
    params:
      - name: format
        type: select
        label: "Format"
        default: jpeg
        options:
          - { label: "PNG", value: png }
          - { label: "JPEG", value: jpeg }
          - { label: "WebP", value: webp }
      - name: quality
        type: select
        label: "Quality"
        default: balanced
        description: "Small files lose more detail. PNG is always lossless."
        when: { field: format, not_equals: png }
        options:
          - { label: "High", value: high }
          - { label: "Balanced", value: balanced }
          - { label: "Small", value: small }
      - name: max_side
        type: select
        label: "Largest side"
        default: 0
        description: "Shrinks a larger image so that its longest side fits; a smaller one keeps its size."
        options:
          - { label: "Original size", value: 0 }
          - { label: "3840 px", value: 3840 }
          - { label: "2560 px", value: 2560 }
          - { label: "1920 px", value: 1920 }
          - { label: "1280 px", value: 1280 }
          - { label: "1024 px", value: 1024 }
          - { label: "640 px", value: 640 }
      - name: background
        type: color
        label: "Background"
        default: "#ffffff"
        description: "JPEG has no transparency: transparent areas are filled with this colour."
        when: { field: format, equals: jpeg }
      - name: keep_metadata
        type: checkbox
        label: "Keep metadata"
        default: true
        description: "Keeps the EXIF data, such as the camera and the date. The colour profile is always kept."

  - id: "media-convert.video"
    label: "Convert video"
    description: "Save the video as MP4 or MOV (H.264), WebM (VP9) or MP4 (H.265), optionally smaller"
    icon: "film"
    accepts: [video]
    produces: video
    cardinality: one_to_one
    scopes: [library, history]
    python: "tools/video.py:ConvertVideo"
    params:
      - name: format
        type: select
        label: "Format"
        default: mp4
        options:
          - { label: "MP4 (H.264)", value: mp4 }
          - { label: "MOV (H.264)", value: mov }
          - { label: "WebM (VP9)", value: webm }
          - { label: "MP4 (H.265)", value: hevc }
        description: "MP4 (H.265) works only when an admin allows it in the settings of Media Converter."
      - name: quality
        type: select
        label: "Quality"
        default: balanced
        description: "Small files lose more detail."
        options:
          - { label: "High", value: high }
          - { label: "Balanced", value: balanced }
          - { label: "Small", value: small }
      - name: max_side
        type: select
        label: "Largest side"
        default: 0
        description: "Shrinks a larger video so that its longest side fits; a smaller one keeps its size."
        options:
          - { label: "Original size", value: 0 }
          - { label: "3840 px", value: 3840 }
          - { label: "2560 px", value: 2560 }
          - { label: "1920 px", value: 1920 }
          - { label: "1280 px", value: 1280 }
          - { label: "1024 px", value: 1024 }
          - { label: "640 px", value: 640 }
      - name: keep_metadata
        type: checkbox
        label: "Keep metadata"
        default: true
        description: "Keeps the title and other tags, the chapters, every sound track and the text subtitles. Off, only the picture and the first sound track are kept."

  - id: "media-convert.audio"
    label: "Convert sound"
    description: "Save the sound as WAV, MP3, FLAC, M4A or OGG"
    icon: "audio"
    accepts: [audio]
    produces: audio
    cardinality: one_to_one
    scopes: [library, history]
    python: "tools/audio.py:ConvertAudio"
    params:
      - name: format
        type: select
        label: "Format"
        default: mp3
        options:
          - { label: "WAV", value: wav }
          - { label: "MP3", value: mp3 }
          - { label: "FLAC", value: flac }
          - { label: "M4A (AAC)", value: m4a }
          - { label: "OGG (Opus)", value: ogg }
      - name: quality
        type: select
        label: "Quality"
        default: balanced
        description: "Small files lose more detail. WAV and FLAC are always lossless."
        when: { field: format, not_in: [wav, flac] }
        options:
          - { label: "High", value: high }
          - { label: "Balanced", value: balanced }
          - { label: "Small", value: small }
      - name: keep_metadata
        type: checkbox
        label: "Keep metadata"
        default: true
        description: "Keeps the title, the artist and the other tags."

  - id: "media-convert.extract-audio"
    label: "Extract sound"
    description: "Save the sound of a video as WAV, MP3, FLAC, M4A or OGG"
    icon: "editor-music"
    accepts: [video]
    produces: audio
    cardinality: one_to_one
    requires: { has_audio: true }
    scopes: [library, history]
    python: "tools/extract_audio.py:ExtractAudio"
    params:
      - name: format
        type: select
        label: "Format"
        default: m4a
        options:
          - { label: "WAV", value: wav }
          - { label: "MP3", value: mp3 }
          - { label: "FLAC", value: flac }
          - { label: "M4A (AAC)", value: m4a }
          - { label: "OGG (Opus)", value: ogg }
      - name: quality
        type: select
        label: "Quality"
        default: balanced
        description: "Small files lose more detail. WAV and FLAC are always lossless."
        when: { field: format, not_in: [wav, flac] }
        options:
          - { label: "High", value: high }
          - { label: "Balanced", value: balanced }
          - { label: "Small", value: small }
      - name: keep_metadata
        type: checkbox
        label: "Keep metadata"
        default: true
        description: "Keeps the title and the other tags of the video."

  - id: "media-convert.animation"
    label: "Make an animation"
    description: "Save a part of the video, 30 seconds at most, as a looping GIF or animated WebP"
    icon: "play"
    accepts: [video]
    produces: image
    cardinality: one_to_one
    scopes: [library, history]
    python: "tools/animation.py:MakeAnimation"
    params:
      - name: format
        type: select
        label: "Format"
        default: gif
        description: "A GIF plays everywhere but grows fast with grain and movement, about 3 MB per second at 640 px on grainy footage in our tests; an animated WebP was 2 to 16 times lighter in our tests."
        options:
          - { label: "GIF", value: gif }
          - { label: "Animated WebP", value: webp }
      - name: start
        type: float
        label: "Start"
        default: 0
        min: 0
        step: 0.1
        unit: "s"
      - name: length
        type: float
        label: "Length"
        default: 10
        min: 0.5
        max: 30
        step: 0.5
        unit: "s"
        description: "Stops at the end of the video if it comes first."
      - name: max_side
        type: select
        label: "Largest side"
        default: 480
        description: "A smaller video keeps its size."
        options:
          - { label: "640 px", value: 640 }
          - { label: "480 px", value: 480 }
          - { label: "320 px", value: 320 }
      - name: frame_rate
        type: select
        label: "Frame rate"
        default: full
        description: "Fewer frames make a lighter file. Each step keeps every second or third frame, so the motion stays even."
        options:
          - { label: "Like the video, 25 per second at most", value: full }
          - { label: "Half", value: half }
          - { label: "A third", value: third }
      - name: quality
        type: select
        label: "Quality"
        default: balanced
        description: "Small files lose more detail."
        options:
          - { label: "High", value: high }
          - { label: "Balanced", value: balanced }
          - { label: "Small", value: small }

  - id: "media-convert.lighten"
    label: "Lighten for sending"
    description: "Save the video as an MP4 (H.264) under a size you choose, to send it by message or email"
    icon: "shrink"
    accepts: [video]
    produces: video
    cardinality: one_to_one
    scopes: [library, history]
    python: "tools/lighten.py:LightenVideo"
    params:
      - name: target
        type: select
        label: "Largest size"
        default: 16
        description: "A video already lighter than this, in MP4 or MOV with an 8-bit 4:2:0 H.264 picture and AAC sound in mono or stereo, is copied without being encoded again."
        options:
          - { label: "8 MB", value: 8 }
          - { label: "16 MB", value: 16 }
          - { label: "18 MB", value: 18 }
          - { label: "20 MB", value: 20 }
          - { label: "30 MB", value: 30 }
          - { label: "50 MB", value: 50 }
      - name: keep_sound
        type: checkbox
        label: "Keep the sound"
        default: true
        description: "Off, the result has no sound and leaves more room for the picture."
      - name: keep_metadata
        type: checkbox
        label: "Keep metadata"
        default: false
        description: "Off by default, so that the place where the video was filmed does not leave with it. On, the title and the other tags are kept too."

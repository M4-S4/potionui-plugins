schema = 1
id = "potion-v1"
version = "1.0.0"
seed = 12345

[cases]
file = "../../cases/02cce6fdd.json"
sha256 = "e6fe2971ed93eb46e4b77bf3eb539459ab211ff61f7703ce6a7fd8ecc574db32"

[bible]
bottle = "a small round glass potion bottle with a long neck, sealed with a cork stopper, filled with a glowing violet liquid, a cream paper label hand-lettered with the word \"PotionUI\", standing on an old oak workbench"
bottle_gold = "the same small round glass potion bottle with a long neck and a cork stopper, its liquid turned to a glowing molten gold, the cream paper label hand-lettered with the word \"PotionUI\", standing on the same old oak workbench"
lumi = "Lumi, a young witch in her early thirties, with a youthful face, smooth fair skin with light freckles, amber eyes and long wavy lilac-grey hair, wearing a worn midnight-blue felt hat with a golden star pin, a midnight-blue velvet dress with an embroidered cream collar, and silver rings"
workshop = "an old witch's cottage workshop with rough timber beams, a stone hearth with a crackling fire, a dented copper cauldron, dusty glass jars, bundles of dried herbs and melted candles"
look = "realistic cinematic photograph, warm firelight and candlelight, shallow depth of field, the violet of the potion as the constant colour, gold for the magic"
motion = "realistic cinematic shot, warm firelight and candlelight, shallow depth of field, smooth slow camera motion, the violet of the potion as the constant colour, gold for the magic"
lyrics = "[Verse]\nviolet light in a bottle of glass\ncork in the neck while the long nights pass\n\n[Chorus]\none drop of gold and the embers rise\nmagic is waking in Lumi's eyes"

[prompts.image]
positive = "{bottle}, inside {workshop}, {look}"

[prompts.img2img]
positive = "{bottle}, the violet liquid glowing brighter with tiny golden sparks inside, {look}"

[prompts.edit]
positive = "change the liquid to emerald green, keep the bottle and the label"

[prompts.enhance]
positive = "{bottle}, inside {workshop}, sharp fine detail on the glass, the cork and the paper label, {look}"

[prompts.inpaint]
positive = "a small golden star-shaped wax seal pressed on the glass"

[prompts.restyle]
positive = "an old master oil painting of {bottle}, rich violet and gold, warm candlelight, visible brush strokes"

[prompts.control]
positive = "{lumi}, standing by the stone hearth of her workshop, holding a small glowing violet potion bottle, {look}"

[prompts.combine]
positive = "put the potion bottle from <image1> on the oak workbench in <image2>, keep its label and its violet glow, {look}"

[prompts.text]
positive = ""
form = {current_text = "PotionUI", new_text = "Lumi's Brew"}

[prompts.still_bottle]
positive = "{bottle}, centered in the frame, seen from the front at eye level, the label facing the camera, {workshop} softly blurred behind, {look}"

[prompts.still_bottle_gold]
positive = "{bottle_gold}, centered in the frame, seen from the front at eye level, the label facing the camera, {workshop} softly blurred behind, {look}"

[prompts.still_lumi]
positive = "portrait of {lumi}, a young woman of about thirty, head and shoulders, facing the camera, gentle smile, soft firelight on her face, {workshop} softly blurred behind, {look}"

[prompts.still_workshop]
positive = "wide shot of {workshop}, a small glowing violet potion bottle on the oak workbench in the middle, {look}"

[prompts.still_object]
positive = "the small round glass potion bottle with a long neck, a cork stopper and a glowing violet liquid, alone and centered on a plain light grey studio background, three-quarter view, soft even studio light, product photograph"

[prompts.t2v]
positive = "slow push-in on {bottle}, the violet liquid swirling with glowing golden particles, a thin mist rising from the neck, {workshop} softly blurred behind, {motion}"

[prompts.t2va]
positive = "slow push-in on {bottle}, the violet liquid swirling with glowing golden particles, a thin mist rising from the neck, {workshop} softly blurred behind, {motion}, the soft bubbling of the potion and the crackle of the fire"

[prompts.t2v_clip]
positive = "{bottle}, the violet liquid slowly swirling with glowing golden particles, a thin mist rising from the neck, the camera slowly pushing in, {motion}"

[prompts.t2v_lumi]
positive = "{lumi}, in her workshop, slowly turns her head towards the camera and speaks a few words with a warm smile, firelight flickering on her face, medium close-up, {motion}"

[prompts.i2v]
positive = "the violet liquid inside the bottle starts to swirl and glow, golden sparks rise from the cork, the camera slowly pushes in, {motion}"

[prompts.flf]
positive = "the glowing violet liquid inside the bottle slowly turns to molten gold, golden sparks swirl around the neck, {motion}"

[prompts.flfa]
positive = "the glowing violet liquid inside the bottle slowly turns to molten gold, golden sparks swirl around the neck, {motion}, a soft rising magical chime"

[prompts.refs]
positive = "Lumi, the witch from the reference, lifts a small glowing violet potion bottle from her oak workbench and smiles at it, firelight flickering on her face, {motion}, the crackle of the hearth and a soft magical chime"

[prompts.remix]
positive = "the same shot, but the liquid in the bottle now glows emerald green, {motion}"

[prompts.extend]
positive = "the camera keeps pushing in on the bottle as the violet liquid glows brighter and golden sparks rise from the cork, {motion}"

[prompts.add_water]
positive = "a thin layer of rippling water covers the oak workbench and reflects the violet glow of the bottle, {motion}"

[prompts.day_to_night]
positive = "deep night, the workshop lit only by the glowing violet potion and a few candles, {motion}"

[prompts.remove_object]
positive = "remove the cork stopper from the bottle"

[prompts.colorize]
positive = "natural colours: a glowing violet liquid, warm orange firelight, honey-brown oak, cream paper label"

[prompts.cinemagraph]
positive = "only the violet liquid inside the bottle swirls and glows, everything else stays perfectly still"

[prompts.layout]
positive = "{workshop}, a small glowing violet potion bottle on the oak workbench, {motion}"

[prompts.transition]
positive = "the violet liquid inside the bottle slowly turns to molten gold, golden sparks swirl around the neck, {motion}"

[prompts.transparent]
positive = "the potion bottle alone, its violet liquid swirling and glowing, on a transparent background"

[prompts.song_music3]
positive = "{lyrics}"
form = {description = "gentle folk ballad, celtic harp, soft hand percussion and a low cello. bpm is 84. key is D, and scale is minor. female alto, warm and breathy."}

[prompts.song_music3_instrumental]
positive = ""
form = {description = "candlelit folk instrumental, celtic harp, soft hand percussion and a low cello. bpm is 84."}

[prompts.song_yue2]
positive = "{lyrics}"
form = {style = "folk ballad, celtic harp, hand drums, low cello, warm female alto vocals, breathy, candlelit mood, bpm 84"}

[negatives]
anima = "worst quality, low quality, score_1, score_2, score_3, bad hands, bad fingers, watermark, text"


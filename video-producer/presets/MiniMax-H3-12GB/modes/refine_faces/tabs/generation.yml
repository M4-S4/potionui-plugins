fields:
  - name: "speed_profile"
    type: "select"
    formula: "speed"
    label: "Speed profile"
    default: "custom"
    ai_hint: "The face refine's own recipe is 6 steps; Custom starts there and leaves the Steps slider on the Advanced tab to the user. Turbo pins 4 steps. Quality pins 24, much slower; suggest it only when refined faces still look soft."
    configuration:
      options:
        - { label: "Quality", value: "quality", sub_label: "24 steps" }
        - { label: "Turbo", value: "turbo", sub_label: "4 steps" }
        - { label: "Custom", value: "custom", sub_label: "6 steps by default, left alone" }
  - type: "section"
    label: "Video"
    children:
      - name: "seed"
        type: "seed"
        label: "Seed"
        default: -1

  - type: "section"
    label: "Models"
    formula: "models"
    children: "{{ paths.preset }}/files/form/models_refine.yml"

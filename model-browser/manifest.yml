id: "model-browser"
name: "Model Browser"
version: "0.1.0"
description: "Browse and download models from CivitAI, Hugging Face, OpenModelDB and CivArchive"
author: "Masa"
license: "GPL-3.0"
type: "full-stack"
category: "sources"

api:
  module: "backend/api.py"

hooks:
  backend:
    - hook: "plugin.lifecycle.boot"
      handler: "hooks.lifecycle_hooks.on_boot"        # tables (idempotent); watcher on a runtime enable
    - hook: "plugin.lifecycle.ready"
      handler: "hooks.lifecycle_hooks.on_ready"       # run_on_app_loop(watcher.run())
    - hook: "plugin.lifecycle.disable"
      handler: "hooks.lifecycle_hooks.on_disable"     # stops the watcher
    - hook: "provider.register"
      handler: "hooks.provider_hooks.register_providers"   # the `model-browser` provider (PLAN.md §7.3)
    - hook: "notification_type.register"
      handler: "hooks.notification_hooks.register_types"   # request / download notification types (PLAN.md §4.4)

pages:
  - route: "model-browser"           # page URL: /plugins/model-browser
    component: "ModelBrowserPage.js"
    label: "Model Browser"
sidebar:
  - label: "Model Browser"
    route: "model-browser"           # must be the same as pages[].route
    icon: "M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"   # `d` attribute of a 24x24 SVG path
    order: 75                        # no require_role: access is decided by the plugin's RBAC (PLAN.md §4)

admin_tabs:
  - id: "permissions"
    label: "Permissions"
    component: "PermissionsTab.js"      # frontend/src/PermissionsTab.svelte, built standalone
    order: 10

# Admin -> Plugins "Setup": downloads that need a login use these providers' credentials.
# `check` is "module.path:Class" from the plugin root, loaded by PluginLoader.load_class.
setup:
  - kind: "check"
    check: "backend.setup_checks:CivitaiProviderReady"
    label: "Configure the CivitAI provider (API key) so logged-in downloads work"
  - kind: "check"
    check: "backend.setup_checks:HuggingFaceProviderReady"
    label: "Configure the Hugging Face provider (token) for gated repositories"

docs:
  - path: "README.md"
    title: "Model Browser"
    audience: "admin"

# Model attributes filled after a download (PLAN.md §7.4 step 7). No source-URL attribute:
# the model page's "Mirrors" section links the source through get_model_page_url().
model_metadata_fields:
  - key: "mb_base_model"
    label: "Base model"
    field_type: "text"
    description: "Base model as the source states it (filled by Model Browser)"
  - key: "mb_license"
    label: "License"
    field_type: "text"
    description: "License as the source states it (filled by Model Browser)"

# Plan limits an admin can add to the core's plans (PLAN.md §4.5). The core only enforces
# limits on submits and uploads, so the plugin enforces these itself before it queues a
# download (backend/limits.py): `applies_handler` keeps the core from ever applying them,
# and the usage is the ledger the plugin records into (one event per queued file, refunded
# when the download fails). `measure_handler` reads that ledger back: without `ledger: true`
# the core requires one. Handlers are "module.path.function" from the plugin root.
limit_kinds:
  - key: "model-browser.downloads"
    label: "Model downloads per month"
    short_label: "Model downloads"
    description: "Files queued from the Model Browser for the user (downloads and approved requests); a failed download is refunded"
    value_type: "count"
    unit: "per month"
    window: "month"
    enforce_at: ["submit"]
    ledger: false
    measure_handler: "backend.limit_handlers.ledger_total"
    applies_handler: "backend.limit_handlers.never_applies"
  - key: "model-browser.download_bytes"
    label: "Downloaded model bytes per month"
    short_label: "Model download volume"
    description: "Size of the files queued from the Model Browser for the user; a failed download is refunded"
    value_type: "bytes"
    window: "month"
    enforce_at: ["submit"]
    ledger: false
    measure_handler: "backend.limit_handlers.ledger_total"
    applies_handler: "backend.limit_handlers.never_applies"

# Defaults are applied by backend/settings.py (the core stores values as strings and does
# not seed them); keep the two in step.
settings:
  - name: "nsfw_ceiling"
    type: "select"
    label: "NSFW in the browser"
    description: "Can only make the instance and group content policy stricter"
    default: "inherit"
    options:
      - { value: "inherit", label: "Follow the content policy" }
      - { value: "blur",    label: "Blur at most" }
      - { value: "blocked", label: "Never show" }
  - name: "nsfw_max_level"
    type: "select"
    label: "Highest CivitAI image level treated as safe"
    description: "Images above this level count as NSFW and follow the content policy; models whose images are all above it count as NSFW models"
    default: "2"
    options:
      - { value: "1", label: "PG" }
      - { value: "2", label: "PG-13" }
      - { value: "4", label: "R" }
      - { value: "8", label: "X" }
  - name: "hide_poi"
    type: "boolean"
    label: "Hide CivitAI models depicting real people"
    default: false
  - name: "civitai_api_base"
    type: "string"
    label: "CivitAI API base URL"
    description: "Switch to https://civitai.red/api/v1 if civitai.com starts filtering the API to SFW content"
    default: "https://civitai.com/api/v1"
  - name: "enable_civarchive"
    type: "boolean"
    label: "Enable CivArchive (experimental, unofficial)"
    default: false
  - name: "cache_ttl_minutes"
    type: "number"
    label: "Search cache TTL (minutes)"
    description: "1 to 1440; raw source answers are cached in the database and filtered per user on every request"
    default: 10
  - name: "providers_notice"
    type: "info"
    label: "Logged-in downloads use the CivitAI and Hugging Face provider plugins"
    description: "Configure their API key / token there; models that require a login fail with 401 otherwise."
    href: "/admin?tab=plugins&id=civitai-provider"
    link_label: "Open the CivitAI provider"
